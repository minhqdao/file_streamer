name: CI
on: push

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dart-lang/setup-dart@v1
            - name: Remove Flutter deps to run formatter in a pure Dart environment
              run: sed -i '/file_picker:/d' pubspec.yaml
            - run: dart pub get --no-example
            - run: dart format -o none --set-exit-if-changed .

    analyze:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dart-lang/setup-dart@v1
            - uses: subosito/flutter-action@v2
            - run: dart pub get --no-example
            - name: Exclude example for CI
              run: echo -e "\nanalyzer:\n  exclude:\n    - \"example/**\"" >> analysis_options.yaml
            - run: dart analyze --fatal-infos --fatal-warnings

    test:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: dart-lang/setup-dart@v1
            - uses: subosito/flutter-action@v2
            - run: dart pub get --no-example
            - run: dart test

    test-cli:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dart-lang/setup-dart@v1
            - name: Remove Flutter deps to simulate a pure Dart environment
              run: sed -i '/file_picker:/d' pubspec.yaml
            - run: dart pub get --no-example
            - run: dart test test/file_streamer_cli_test.dart

    test-chrome:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dart-lang/setup-dart@v1
            - uses: subosito/flutter-action@v2
            - run: dart pub get --no-example
            - run: dart test -p chrome

    test-wasm:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dart-lang/setup-dart@v1
            - uses: subosito/flutter-action@v2
            - run: dart pub get --no-example
            - name: Run browser tests compiled to Wasm
              run: dart test -p chrome --compiler dart2wasm

    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dart-lang/setup-dart@v1
            - uses: subosito/flutter-action@v2
            - run: dart pub get --no-example
            - run: dart pub global activate coverage
            - run: dart test --coverage=coverage
            - name: Enforce minimum line coverage
              run: |
                dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -o coverage/lcov.info -i coverage
                awk -F'[:,]' '/^DA:/{t++; if ($3 > 0) h++} END {pct=(t ? 100*h/t : 100); printf "line coverage: %.1f%% (%d/%d)\n", pct, h, t; exit (pct < 65)}' coverage/lcov.info
